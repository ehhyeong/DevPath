<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI 코드 리뷰 대시보드 미리보기</title><desc id="desc">PR 변경 파일과 리뷰 항목, 위험도 및 해결 상태를 함께 확인하는 코드 리뷰 화면이다.</desc>
  <rect width="1200" height="675" fill="#e7ebf4"/>
  <g font-family="Arial, Malgun Gothic, sans-serif">
    <text x="60" y="65" font-size="19" font-weight="700" fill="#526591" letter-spacing="3">REVIEW DESK / DIFF TO DECISION</text>
    <rect x="50" y="100" width="1100" height="533" rx="18" fill="#f8fafc"/>
    <path d="M68 100H1132Q1150 100 1150 118V169H50V118Q50 100 68 100" fill="#1e293f"/>
    <text x="79" y="143" font-size="23" font-weight="700" fill="#e4ebf8">review<tspan fill="#9eb0fa">desk</tspan></text><text x="271" y="141" font-size="14" fill="#99a9c7">Overview</text><text x="377" y="141" font-size="14" fill="#e3ebff">Pull requests</text><text x="512" y="141" font-size="14" fill="#99a9c7">Review rules</text><circle cx="1100" cy="134" r="16" fill="#7c95c9"/><text x="1094" y="139" font-size="13" fill="#fff">D</text>
    <text x="78" y="208" font-size="12" letter-spacing="2" fill="#8c9bb2">DEVPATH / BACKEND</text><text x="78" y="245" font-size="25" font-weight="700" fill="#2e3c55">#42  Refresh token rotation 적용</text><rect x="969" y="218" width="152" height="35" rx="17" fill="#e4edff"/><text x="991" y="241" font-size="13" fill="#5b78bf">✓ 리뷰 분석 완료</text>
    <text x="79" y="273" font-size="13" fill="#8c9bb2">정다은 · feature/auth-refresh → main · 변경 파일 4개</text>
    <rect x="78" y="298" width="181" height="304" rx="10" fill="#fff" stroke="#e1e7f0"/><text x="95" y="328" font-size="13" fill="#546989" font-weight="700">CHANGED FILES</text><g font-family="Consolas, monospace" font-size="12" fill="#8291a9"><text x="95" y="372" fill="#536faf">AuthService.java</text><text x="95" y="412">TokenStore.java</text><text x="95" y="452">AuthController.java</text><text x="95" y="492">AuthServiceTest.java</text></g><text x="95" y="573" font-size="12" fill="#8697b0">+126  /  −38</text>
    <rect x="277" y="298" width="494" height="304" rx="10" fill="#162238"/><text x="296" y="330" font-size="13" fill="#adbed9">AuthService.java</text><path d="M277 345H771" stroke="#2b3d58"/>
    <g font-family="Consolas, monospace" font-size="13"><text x="294" y="377" fill="#7185a4">42</text><text x="329" y="377" fill="#c49bd6">public TokenPair refresh(String token) {</text><rect x="287" y="390" width="473" height="31" fill="#25473f"/><text x="294" y="411" fill="#7cb19c">43</text><text x="329" y="411" fill="#a5d9b8">+ var session = tokenStore.find(token);</text><text x="294" y="446" fill="#7185a4">44</text><text x="342" y="446" fill="#a2bfdc">validateSession(session);</text><rect x="287" y="460" width="473" height="31" fill="#25473f"/><text x="294" y="481" fill="#7cb19c">45</text><text x="329" y="481" fill="#a5d9b8">+ tokenStore.revoke(session);</text><text x="294" y="516" fill="#7185a4">46</text><text x="342" y="516" fill="#a2bfdc">return issueNewTokens(session.user());</text><text x="294" y="551" fill="#7185a4">47</text><text x="329" y="551" fill="#c49bd6">}</text></g>
    <rect x="789" y="298" width="333" height="304" rx="10" fill="#fff" stroke="#e1e7f0"/><text x="810" y="331" font-size="15" font-weight="700" fill="#435778">리뷰 항목</text><rect x="810" y="351" width="83" height="25" rx="5" fill="#fff0dc"/><text x="824" y="368" font-size="11" font-weight="700" fill="#ba7b30">동시성 · 검토</text><text x="810" y="408" font-size="16" font-weight="700" fill="#394d6c">토큰 재사용 방지 확인</text><text x="810" y="438" font-size="13" fill="#8190a8">동일 토큰으로 요청이 겹칠 때</text><text x="810" y="462" font-size="13" fill="#8190a8">폐기와 재발급이 원자적으로</text><text x="810" y="486" font-size="13" fill="#8190a8">처리되는지 테스트가 필요합니다.</text><text x="810" y="525" font-size="12" fill="#607eaf">근거 보기 · lines 43–46 →</text><rect x="810" y="550" width="290" height="32" rx="6" fill="#eaf0fc"/><text x="894" y="572" font-size="13" fill="#5778b2">담당자 검토 후 해결</text>
  </g>
