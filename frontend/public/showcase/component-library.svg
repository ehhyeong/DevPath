<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">React 컴포넌트 라이브러리 미리보기</title><desc id="desc">버튼 상태, 폼 컴포넌트와 디자인 토큰을 문서화한 UI 라이브러리 화면이다.</desc>
  <rect width="1200" height="675" fill="#f2eafb"/>
  <g font-family="Arial, Malgun Gothic, sans-serif">
    <text x="60" y="65" font-size="19" font-weight="700" fill="#7c53a8" letter-spacing="3">FORM &amp; FUNCTION / COMPONENT LIBRARY</text>
    <rect x="50" y="100" width="1100" height="533" rx="18" fill="#fff" stroke="#dfd2ec"/>
    <path d="M272 100V633" stroke="#ede5f4"/>
    <rect x="74" y="127" width="30" height="30" rx="8" fill="#8b5fc6"/><text x="83" y="149" font-size="22" fill="#fff" font-weight="700">f</text><text x="115" y="150" font-size="20" font-weight="700" fill="#3e3155">formkit</text><text x="202" y="149" font-size="12" fill="#9a8aac">v0.8</text>
    <g font-size="15" fill="#8a799c"><text x="79" y="207" font-size="12" letter-spacing="2">FOUNDATIONS</text><text x="85" y="245">Color tokens</text><text x="85" y="284">Typography</text><text x="79" y="335" font-size="12" letter-spacing="2">COMPONENTS</text><text x="85" y="375" fill="#8150b4" font-weight="700">Buttons</text><text x="85" y="416">Form fields</text><text x="85" y="457">Dialog</text><text x="85" y="498">Tabs</text><text x="85" y="539">Data table</text></g>
    <text x="307" y="154" font-size="12" letter-spacing="2" fill="#a38cb6">COMPONENTS / ACTIONS</text><text x="307" y="197" font-size="32" font-weight="700" fill="#3e3155">Buttons</text><text x="307" y="228" font-size="15" fill="#8e7d9f">분명한 상태와 일관된 인터랙션으로 다음 행동을 안내합니다.</text>
    <text x="308" y="270" font-size="13" fill="#8750bc" font-weight="700">Preview</text><text x="391" y="270" font-size="13" fill="#9a8aac">Usage</text><text x="458" y="270" font-size="13" fill="#9a8aac">Accessibility</text><path d="M307 284H1114" stroke="#ece4f3"/>
    <rect x="307" y="306" width="807" height="117" rx="12" fill="#faf7fd" stroke="#ece3f5"/>
    <rect x="334" y="341" width="155" height="46" rx="8" fill="#8652b8"/><text x="365" y="370" font-size="15" font-weight="700" fill="#fff">프로젝트 만들기</text><rect x="509" y="341" width="130" height="46" rx="8" fill="#fff" stroke="#ccb9df"/><text x="545" y="370" font-size="15" fill="#79579c">자세히 보기</text><rect x="661" y="341" width="125" height="46" rx="8" fill="#e8e1ee"/><text x="699" y="370" font-size="15" fill="#b4a4c2">비활성</text><rect x="807" y="341" width="161" height="46" rx="8" fill="#ac89cd"/><text x="840" y="370" font-size="15" fill="#fff">◌ 저장하는 중</text>
    <rect x="307" y="446" width="391" height="158" rx="12" fill="#fff" stroke="#ece3f5"/><text x="329" y="478" font-size="15" font-weight="700" fill="#4a385e">Form field</text><text x="329" y="510" font-size="12" fill="#877695">프로젝트 이름</text><rect x="329" y="523" width="347" height="42" rx="7" fill="#fff" stroke="#a480c6"/><text x="344" y="549" font-size="14" fill="#6e597f">함께 만드는 디자인 시스템</text><text x="329" y="585" font-size="12" fill="#a18cad">도움말과 오류 메시지를 입력 요소에 연결합니다.</text>
    <rect x="720" y="446" width="394" height="158" rx="12" fill="#fff" stroke="#ece3f5"/><text x="742" y="478" font-size="15" font-weight="700" fill="#4a385e">Semantic tokens</text><circle cx="760" cy="526" r="19" fill="#8652b8"/><circle cx="821" cy="526" r="19" fill="#53ad8e"/><circle cx="882" cy="526" r="19" fill="#e6b777"/><circle cx="943" cy="526" r="19" fill="#d47c94"/><circle cx="1004" cy="526" r="19" fill="#4a385e"/><text x="742" y="582" font-size="12" fill="#a18cad">Brand · Success · Warning · Danger · Text</text>
