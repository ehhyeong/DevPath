    <path d="M297 153V633" stroke="#2a3850"/>
    <g font-size="14" fill="#97a9c6"><text x="76" y="193" fill="#d7e4f9" font-weight="700">COLLECTIONS</text><text x="76" y="238">인증 및 토큰</text><text x="76" y="281">예약 관리</text><text x="91" y="324" fill="#71d6b0">POST  예약 생성</text><text x="91" y="365">GET   예약 목록</text><text x="91" y="406">GET   예약 상세</text><text x="91" y="447">DEL   예약 취소</text><text x="76" y="514" fill="#d7e4f9" font-weight="700">ENVIRONMENTS</text><text x="92" y="552">● local</text><text x="92" y="585">○ staging</text></g>
    <text x="323" y="195" font-size="21" font-weight="700" fill="#e1ebff">예약 생성</text><text x="1002" y="195" font-size="12" fill="#9bb0d0">OpenAPI 3.1</text>
    <rect x="323" y="216" width="790" height="52" rx="8" fill="#23324c"/><text x="340" y="248" font-size="15" fill="#76dfb7" font-weight="700">POST</text><text x="410" y="248" font-size="15" fill="#d3def0">{{baseUrl}}/api/reservations</text><rect x="1017" y="222" width="89" height="40" rx="6" fill="#809fec"/><text x="1041" y="247" font-size="14" fill="#0e234a" font-weight="700">Send →</text>
