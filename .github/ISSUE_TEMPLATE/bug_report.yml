name: 버그 신고
description: 재현 가능한 오류나 예상과 다른 동작을 제보합니다.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 민감한 키, 비밀번호, 토큰과 개인정보는 첨부하지 마세요.
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 실제로 발생한 문제를 간단히 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 다른 팀원이 같은 문제를 확인할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. 로그인한다.
        2. 특정 페이지로 이동한다.
        3. 버튼을 누른다.
        4. 오류를 확인한다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그와 화면
      description: 비밀값을 제거한 로그, 스택 트레이스, 스크린샷을 첨부해 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      options:
        - Backend
        - Frontend
        - OCR Server
        - Infrastructure
        - Documentation
        - Multiple areas
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저, 실행 프로필 또는 배포 환경을 작성해 주세요.
      placeholder: Windows 11, Chrome, local profile
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 이 이슈가 해결됐다고 판단할 수 있는 검증 기준을 작성해 주세요.
    validations:
      required: true
