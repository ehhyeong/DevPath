<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080" role="img" aria-labelledby="title description">
  <title id="title">DevPath 시스템 아키텍처</title>
  <desc id="description">학습자, 강사, 관리자가 React 애플리케이션을 이용하고 Nginx를 거쳐 Spring Boot API, 데이터 저장소, 미디어 처리 서비스와 외부 API에 연결되는 구조</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fffb"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="spring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
      .section-label { fill: #047857; font-size: 14px; font-weight: 800; letter-spacing: 1.6px; }
      .card-title { fill: #0f172a; font-size: 18px; font-weight: 800; }
      .card-copy { fill: #64748b; font-size: 13px; font-weight: 500; }
      .small-title { fill: #0f172a; font-size: 15px; font-weight: 800; }
      .small-copy { fill: #64748b; font-size: 12px; font-weight: 500; }
      .flow-label { fill: #475569; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1480" height="1080" rx="32" fill="url(#canvas)"/>
  <circle cx="90" cy="80" r="175" fill="#dcfce7" opacity="0.34"/>
  <circle cx="1390" cy="1010" r="210" fill="#dbeafe" opacity="0.30"/>

  <g transform="translate(84 42)">
    <rect width="48" height="48" rx="14" fill="url(#brand)"/>
    <path d="M14 15h8c8 0 13 4 13 9s-5 9-13 9h-8V15Zm8 12c4 0 6-1 6-3s-2-3-6-3h-2v6h2Z" fill="#fff"/>
  </g>
  <text x="150" y="64" fill="#0f172a" font-size="30" font-weight="900">DevPath System Architecture</text>
  <text x="150" y="88" fill="#64748b" font-size="14" font-weight="600">학습 · 협업 · 커리어 · 운영 기능을 연결하는 단일 Spring Boot 기반 플랫폼</text>

  <g transform="translate(945 43)" filter="url(#softShadow)">
    <rect width="451" height="48" rx="24" fill="#ffffff" stroke="#d1fae5"/>
    <circle cx="25" cy="24" r="7" fill="#22c55e"/>
    <text x="44" y="21" fill="#334155" font-size="12" font-weight="800">DEPLOYMENT</text>
    <text x="44" y="37" fill="#64748b" font-size="11" font-weight="600">GitHub Actions → Oracle Cloud · systemd + Docker Compose</text>
  </g>

  <text x="130" y="139" class="section-label">01 · USERS</text>
  <g filter="url(#softShadow)">
    <g transform="translate(256 157)">
      <rect width="270" height="72" rx="18" fill="#fff" stroke="#dbe4ee"/>
      <circle cx="40" cy="36" r="22" fill="#ecfdf5"/>
      <path d="M32 38c0-7 4-13 8-13s8 6 8 13M28 49c2-6 7-9 12-9s10 3 12 9" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
      <text x="76" y="32" class="card-title">학습자</text>
      <text x="76" y="52" class="card-copy">로드맵 · 강의 · 프로젝트 · 커리어</text>
    </g>
    <g transform="translate(605 157)">
      <rect width="270" height="72" rx="18" fill="#fff" stroke="#dbe4ee"/>
      <circle cx="40" cy="36" r="22" fill="#eff6ff"/>
      <path d="M29 29h22v16H29zM36 49h8" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="m35 35 4 3 6-7" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="32" class="card-title">강사</text>
      <text x="76" y="52" class="card-copy">강의 제작 · 검수 · 학습 분석</text>
    </g>
    <g transform="translate(954 157)">
      <rect width="270" height="72" rx="18" fill="#fff" stroke="#dbe4ee"/>
      <circle cx="40" cy="36" r="22" fill="#fff7ed"/>
      <path d="M40 24 51 29v8c0 7-5 12-11 15-6-3-11-8-11-15v-8l11-5Z" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="m35 37 3 3 7-8" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="32" class="card-title">관리자</text>
      <text x="76" y="52" class="card-copy">거버넌스 · 검수 · 통합 운영</text>
    </g>
  </g>

  <path d="M391 229v26M740 229v26M1089 229v26" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(130 265)" filter="url(#shadow)">
    <rect width="1220" height="145" rx="24" fill="#fff" stroke="#d9e5df"/>
    <text x="28" y="31" class="section-label">02 · CLIENT &amp; DELIVERY</text>
    <g transform="translate(50 52)">
      <rect width="475" height="68" rx="16" fill="#f8fafc" stroke="#dbe4ee"/>
      <circle cx="34" cy="34" r="20" fill="#dff8ff"/>
      <path d="M25 34h18M34 25c4 4 4 14 0 18M34 25c-4 4-4 14 0 18M24 29h20M24 39h20" fill="none" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round"/>
      <text x="68" y="29" class="card-title">React 19 SPA</text>
      <text x="68" y="49" class="card-copy">TypeScript · Vite · Axios · hls.js · Tesseract.js</text>
    </g>
    <path d="M548 86h91" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#greenArrow)"/>
    <text x="568" y="73" class="flow-label">HTTPS · WS</text>
    <g transform="translate(665 52)">
      <rect width="505" height="68" rx="16" fill="#f8fafc" stroke="#dbe4ee"/>
      <circle cx="34" cy="34" r="20" fill="#ecfdf5"/>
      <path d="M25 27h18M25 34h18M25 41h18" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
      <text x="68" y="29" class="card-title">Nginx</text>
      <text x="68" y="49" class="card-copy">정적 SPA 제공 · /api · /uploads · /ws · OAuth 프록시</text>
    </g>
  </g>

  <path d="M1040 410v35" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#greenArrow)"/>
  <text x="1060" y="434" class="flow-label">REST · WebSocket</text>

  <g transform="translate(130 455)" filter="url(#shadow)">
    <rect width="1220" height="305" rx="26" fill="url(#spring)" stroke="#86efac" stroke-width="1.4"/>
    <g transform="translate(28 22)">
      <circle cx="17" cy="17" r="17" fill="#16a34a"/>
      <path d="M10 18c6-9 15-8 17-6-2 8-8 13-16 11 3-1 6-3 9-7-4 3-7 4-10 2Z" fill="#fff"/>
      <text x="48" y="16" class="section-label">03 · SPRING BOOT APPLICATION</text>
      <text x="48" y="34" fill="#64748b" font-size="12" font-weight="600">Java 21 · Spring Boot 4 · 단일 애플리케이션 · 계층형 API 구조</text>
    </g>

    <g transform="translate(48 76)">
      <rect width="340" height="74" rx="16" fill="#fff" stroke="#bbf7d0"/>
      <circle cx="34" cy="37" r="20" fill="#ecfdf5"/>
      <path d="M34 24 44 29v8c0 6-4 11-10 14-6-3-10-8-10-14v-8l10-5Z" fill="none" stroke="#059669" stroke-width="2"/>
      <text x="68" y="32" class="small-title">Security Filter</text>
      <text x="68" y="52" class="small-copy">JWT · OAuth2 · Role/Permission · 계정 상태</text>
    </g>
    <g transform="translate(440 76)">
      <rect width="340" height="74" rx="16" fill="#fff" stroke="#bbf7d0"/>
      <circle cx="34" cy="37" r="20" fill="#eff6ff"/>
      <path d="M24 30h20v15H24zM28 26h12" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="32" class="small-title">Controller · WebSocket</text>
      <text x="68" y="52" class="small-copy">REST API · Q&amp;A 실시간 · 음성 시그널링</text>
    </g>
    <g transform="translate(832 76)">
      <rect width="340" height="74" rx="16" fill="#fff" stroke="#bbf7d0"/>
      <circle cx="34" cy="37" r="20" fill="#fff7ed"/>
      <path d="M25 28h18v18H25zM29 24h18v18" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
      <text x="68" y="32" class="small-title">Service · Repository</text>
      <text x="68" y="52" class="small-copy">비즈니스 규칙 · 트랜잭션 · JPA 영속성</text>
    </g>

    <path d="M218 151v20M610 151v20M1002 151v20" stroke="#86a394" stroke-width="1.8" stroke-dasharray="4 4"/>
    <g transform="translate(48 176)">
      <rect width="253" height="82" rx="16" fill="#fff" stroke="#d1fae5"/>
      <rect x="16" y="17" width="34" height="34" rx="10" fill="#dcfce7"/>
      <text x="33" y="40" text-anchor="middle" fill="#047857" font-size="13" font-weight="900">L</text>
      <text x="62" y="34" class="small-title">학습 도메인</text>
      <text x="16" y="64" class="small-copy">로드맵 · 강의 · 평가 · 추천</text>
    </g>
    <g transform="translate(338 176)">
      <rect width="253" height="82" rx="16" fill="#fff" stroke="#dbeafe"/>
      <rect x="16" y="17" width="34" height="34" rx="10" fill="#dbeafe"/>
      <text x="33" y="40" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="900">W</text>
      <text x="62" y="34" class="small-title">협업 도메인</text>
      <text x="16" y="64" class="small-copy">프로젝트 · 워크스페이스 · 멘토링</text>
    </g>
    <g transform="translate(628 176)">
      <rect width="253" height="82" rx="16" fill="#fff" stroke="#ede9fe"/>
      <rect x="16" y="17" width="34" height="34" rx="10" fill="#ede9fe"/>
      <text x="33" y="40" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="900">C</text>
      <text x="62" y="34" class="small-title">커리어 도메인</text>
      <text x="16" y="64" class="small-copy">채용 · 이력서 · 포트폴리오 · Proof</text>
    </g>
    <g transform="translate(918 176)">
      <rect width="253" height="82" rx="16" fill="#fff" stroke="#ffedd5"/>
      <rect x="16" y="17" width="34" height="34" rx="10" fill="#ffedd5"/>
      <text x="33" y="40" text-anchor="middle" fill="#c2410c" font-size="13" font-weight="900">A</text>
      <text x="62" y="34" class="small-title">운영 도메인</text>
      <text x="16" y="64" class="small-copy">관리자 · 신고 · 정산 · 공지 · 실험</text>
    </g>
  </g>

  <path d="M350 760v35M610 760v35M870 760v35M1130 760v35" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(130 805)" filter="url(#shadow)">
    <rect width="1220" height="135" rx="24" fill="#fff" stroke="#dbe4ee"/>
    <text x="28" y="30" class="section-label">04 · DATA &amp; MEDIA SERVICES</text>
    <g transform="translate(36 48)">
      <rect width="266" height="64" rx="15" fill="#f8fafc" stroke="#dbe4ee"/>
      <ellipse cx="34" cy="24" rx="14" ry="6" fill="none" stroke="#2563eb" stroke-width="2"/>
      <path d="M20 24v17c0 4 6 7 14 7s14-3 14-7V24M20 33c0 4 6 7 14 7s14-3 14-7" fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="64" y="27" class="small-title">PostgreSQL / Oracle</text>
      <text x="64" y="47" class="small-copy">프로필별 관계형 데이터</text>
    </g>
    <g transform="translate(330 48)">
      <rect width="266" height="64" rx="15" fill="#f8fafc" stroke="#dbe4ee"/>
      <path d="m22 28 13-7 13 7-13 7-13-7Zm0 8 13 7 13-7" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round"/>
      <text x="64" y="27" class="small-title">Redis 7</text>
      <text x="64" y="47" class="small-copy">캐시 · 실시간 상태 데이터</text>
    </g>
    <g transform="translate(624 48)">
      <rect width="266" height="64" rx="15" fill="#f8fafc" stroke="#dbe4ee"/>
      <path d="M22 27h10l4 4h13v16H22z" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
      <text x="64" y="27" class="small-title">Local Upload Storage</text>
      <text x="64" y="47" class="small-copy">파일 · FFmpeg · HLS/AES 자산</text>
    </g>
    <g transform="translate(918 48)">
      <rect width="266" height="64" rx="15" fill="#f8fafc" stroke="#dbe4ee"/>
      <path d="M22 24h26v22H22zM28 30h14M28 36h10" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
      <text x="64" y="27" class="small-title">Python OCR Server</text>
      <text x="64" y="47" class="small-copy">Flask · EasyOCR · OpenCV</text>
    </g>
  </g>

  <path d="M1350 610h42v403h-32" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1381" y="813" class="flow-label" text-anchor="middle" transform="rotate(90 1381 813)">외부 API 호출</text>
  <g transform="translate(130 975)" filter="url(#shadow)">
    <rect width="1220" height="76" rx="22" fill="#0f172a"/>
    <text x="28" y="27" fill="#6ee7b7" font-size="13" font-weight="800" letter-spacing="1.4">05 · EXTERNAL INTEGRATIONS</text>
    <g transform="translate(28 40)">
      <circle cx="7" cy="6" r="5" fill="#22c55e"/>
      <text x="20" y="11" fill="#e2e8f0" font-size="13" font-weight="700">Gemini · Claude Vision</text>
      <circle cx="248" cy="6" r="5" fill="#60a5fa"/>
      <text x="261" y="11" fill="#e2e8f0" font-size="13" font-weight="700">GitHub · Google OAuth</text>
      <circle cx="516" cy="6" r="5" fill="#fb923c"/>
      <text x="529" y="11" fill="#e2e8f0" font-size="13" font-weight="700">잡코리아 XML API</text>
      <circle cx="744" cy="6" r="5" fill="#c084fc"/>
      <text x="757" y="11" fill="#e2e8f0" font-size="13" font-weight="700">GitHub Pull Request API</text>
      <circle cx="1018" cy="6" r="5" fill="#facc15"/>
      <text x="1031" y="11" fill="#e2e8f0" font-size="13" font-weight="700">DEV.to</text>
    </g>
  </g>
</svg>
